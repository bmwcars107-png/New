name: Build JAR
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Unzip project
        run: unzip -q *.zip
      - name: Build
        run: |
          cd noctis-client
          chmod +x gradlew
          ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: noctis-client
          path: noctis-client/build/libs/*.jar
